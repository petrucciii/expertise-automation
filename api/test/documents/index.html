<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Management</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }
      .container {
        max-width: 900px;
      }
    </style>
  </head>

  <body class="py-5">
    <div class="container">
      <!-- Header -->
      <header class="mb-4">
        <h1 class="h3 fw-bold">Document Management</h1>
        <p class="text-muted">
          Authenticated local test page for PDF, DOCX, XLSX, CSV, email and
          image documents.
        </p>
      </header>

      <form id="loginForm" class="row g-3 mb-4">
        <div class="col-sm-5">
          <label for="email" class="form-label">Email</label
          ><input
            type="email"
            id="email"
            class="form-control"
            autocomplete="username"
            required
          />
        </div>
        <div class="col-sm-5">
          <label for="password" class="form-label">Password</label
          ><input
            type="password"
            id="password"
            class="form-control"
            autocomplete="current-password"
            required
          />
        </div>
        <div class="col-sm-2 align-self-end">
          <button type="submit" class="btn btn-primary">Sign in</button>
        </div>
      </form>

      <!-- Upload Card -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <form id="uploadForm" class="row g-3 align-items-center">
            <div class="col-sm-9">
              <input
                type="file"
                class="form-control"
                id="fileInput"
                accept=".pdf,.docx,.xlsx,.csv,.eml,.png,.jpg,.jpeg,.tif,.tiff"
                aria-label="Select a source document"
                required
              />
            </div>
            <div class="col-sm-3 d-grid">
              <button type="submit" id="uploadBtn" class="btn btn-primary">
                Upload Document
              </button>
            </div>
          </form>
          <div
            id="statusMessage"
            class="alert mt-3 d-none mb-0"
            role="alert"
          ></div>
        </div>
      </div>

      <!-- Documents Table Card -->
      <div class="card shadow-sm">
        <div
          class="card-header bg-white d-flex justify-content-between align-items-center py-3"
        >
          <h2 class="h5 mb-0 fw-semibold">Your Documents</h2>
          <button
            id="refreshBtn"
            type="button"
            class="btn btn-sm btn-outline-secondary"
          >
            🔄 Refresh
          </button>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>File Name</th>
                  <th>Type</th>
                  <th>Date</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="documentsList">
                <!-- Populated dynamically by app.js -->
              </tbody>
            </table>
          </div>
          <div id="emptyState" class="text-center py-5 text-muted d-none">
            No documents found. Upload one to get started!
          </div>
        </div>
      </div>
    </div>

    <pre
      id="extractedText"
      class="container mt-4 text-wrap"
      aria-live="polite"
    ></pre>
    <!-- Application script; no executable third-party scripts are needed. -->
    <script src="app.js"></script>
  </body>
</html>
