<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 900px;
        }
    </style>
</head>

<body class="py-5">
    <div class="container">
        <!-- Header -->
        <header class="mb-4">
            <h1 class="h3 fw-bold">Document Management</h1>
            <p class="text-muted">Upload, manage, download and extract text from your documents (PDF, DOCX)</p>
        </header>

        <!-- Upload Card -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="uploadForm" class="row g-3 align-items-center" onsubmit="event.preventDefault(); handleUpload();">
                    <div class="col-sm-9">
                        <input type="file" class="form-control" id="fileInput"
                            accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                            required>
                    </div>
                    <div class="col-sm-3 d-grid">
                        <button type="submit" id="uploadBtn" class="btn btn-primary">
                            Upload Document
                        </button>
                    </div>
                </form>
                <div id="statusMessage" class="alert mt-3 d-none mb-0" role="alert"></div>
            </div>
        </div>

        <!-- Documents Table Card -->
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                <h2 class="h5 mb-0 fw-semibold">Your Documents</h2>
                <button onclick="loadDocuments()" class="btn btn-sm btn-outline-secondary">
                    🔄 Refresh
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>File Name</th>
                                <th>Type</th>
                                <th>Date</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="documentsList">
                            <!-- Populated dynamically by app.js -->
                        </tbody>
                    </table>
                </div>
                <div id="emptyState" class="text-center py-5 text-muted d-none">
                    No documents found. Upload one to get started!
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS & Application Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
